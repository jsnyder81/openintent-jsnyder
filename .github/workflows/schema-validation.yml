name: JSON Schema validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install check-jsonschema
        run: pip install check-jsonschema

      - name: Validate source YAML against Draft 2020-12 metaschema
        run: check-jsonschema --check-metaschema release/2.0.0/models/src/openintent-wifi.yaml

      - name: Validate published JSON against Draft 2020-12 metaschema
        run: check-jsonschema --check-metaschema release/2.0.0/models/oi-wifi.schema.json

      - name: Validate example payloads against the published schema
        run: check-jsonschema --schemafile release/2.0.0/models/oi-wifi.schema.json release/2.0.0/models/examples/*.json

      - name: Check published JSON matches src YAML
        run: |
          curl -sSL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq eval release/2.0.0/models/src/openintent-wifi.yaml -ojson -P > /tmp/oi-wifi.schema.json
          diff <(jq -S . release/2.0.0/models/oi-wifi.schema.json) <(jq -S . /tmp/oi-wifi.schema.json)
