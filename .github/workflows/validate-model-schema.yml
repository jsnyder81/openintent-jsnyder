name: Validate Model Schema Equivalence

on:
  push:
  pull_request:

jobs:
  validate-model-schema:
    name: Validate model schema equivalence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate schema equivalence
        run: python3 tools/validate_schema_equivalence.py
